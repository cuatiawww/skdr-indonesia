name: SKDR validate and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: skdr-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  validate:
    name: Validate
    runs-on:
      - production:host
      - docker:host
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build backend image validation
        run: docker build --pull -t skdr-indonesia-backend-ci services/backend-rust

      - name: Install frontend dependencies
        working-directory: services/frontend-next
        run: npm ci --no-audit --fund=false

      - name: Typecheck frontend
        working-directory: services/frontend-next
        run: npm run typecheck

      - name: Validate Compose model
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .env' EXIT
          cp .env.example .env
          docker compose config --quiet

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on:
      - production:host
      - docker:host
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy exact commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: bash scripts/deploy-gitea.sh
