services:
  skdr-indonesia-backend:
    build:
      context: ./services/backend-rust
    container_name: skdr-indonesia-backend
    restart: on-failure
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-skdr_indonesia}
      BACKEND_BIND_ADDR: ${BACKEND_BIND_ADDR:-0.0.0.0:8091}
      MIGRATIONS_DIR: ${MIGRATIONS_DIR:-/init}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./database/init:/init:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8091/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  skdr-indonesia-frontend:
    image: node:20
    container_name: skdr-indonesia-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci --no-audit --fund=false && npm run dev -- -p 3200"
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://skdr-indonesia-backend:8091}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/skdr}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-id}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./services/frontend-next:/app
      - skdr_indonesia_fe_node_modules:/app/node_modules
      - skdr_indonesia_fe_next:/app/.next
    networks:
      - backend
      - proxy
    depends_on:
      skdr-indonesia-backend:
        condition: service_healthy

networks:
  backend:
    external: true
    name: backend
  proxy:
    external: true
    name: proxy

volumes:
  skdr_indonesia_fe_node_modules:
  skdr_indonesia_fe_next:
