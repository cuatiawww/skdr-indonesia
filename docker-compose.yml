services:
  skdr-postgres:
    image: postgres:16-alpine
    container_name: skdr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5442}:5432"
    volumes:
      - skdr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  skdr-backend-rust:
    build:
      context: ./services/backend-rust
    container_name: skdr-backend-rust
    restart: on-failure
    env_file: .env
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8091}:8091"
    volumes:
      - ./database/init:/init:ro
    depends_on:
      skdr-postgres:
        condition: service_healthy

  skdr-frontend-next:
    image: node:20
    container_name: skdr-frontend-next
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -p 3200"
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH}
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3200}:3200"
    volumes:
      - ./services/frontend-next:/app
      - skdr_fe_node_modules:/app/node_modules
      - skdr_fe_next:/app/.next
    depends_on:
      - skdr-backend-rust

volumes:
  skdr_pg_data:
  skdr_fe_node_modules:
  skdr_fe_next:
